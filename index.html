<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LINK" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/icon-180.png" />
    <title>LINK</title>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}
      #link-boot-fallback{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
      #link-boot-fallback .logo{font-size:44px;font-weight:900;letter-spacing:-.075em}
      #link-boot-fallback .sub{margin-top:10px;font-size:13px;font-weight:700;color:#8a8a92}
      #link-boot-fallback .diag{display:none;max-width:430px;margin-top:18px;padding:16px 18px;border-radius:20px;background:#fff;border:1px solid rgba(0,0,0,.06);font-size:13px;line-height:1.45;text-align:left;color:#555}
      @media(prefers-color-scheme:dark){html,body,#root{background:#09090b;color:#fff}#link-boot-fallback .diag{background:#17171a;border-color:rgba(255,255,255,.08);color:#c5c5ca}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="link-boot-fallback">
        <div>
          <div class="logo">LINK</div>
          <div class="sub" id="link-boot-status">Opening LINK…</div>
          <div class="diag" id="link-boot-diagnostic"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const showDiagnostic = (message) => {
          const fallback = document.getElementById('link-boot-fallback')
          const status = document.getElementById('link-boot-status')
          const diagnostic = document.getElementById('link-boot-diagnostic')
          if (!fallback || !diagnostic) return
          if (status) status.textContent = 'LINK could not start'
          diagnostic.style.display = 'block'
          diagnostic.textContent = message
        }

        window.addEventListener('error', (event) => {
          const message = event && event.message ? event.message : 'A JavaScript file failed to load.'
          showDiagnostic(message)
        })
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event && event.reason
          showDiagnostic(reason && reason.message ? reason.message : String(reason || 'Unexpected startup error.'))
        })

        window.setTimeout(() => {
          if (!document.getElementById('link-boot-fallback')) return
          showDiagnostic('The React production bundle did not start. For oxvaa/linkpwa, GitHub Pages must deploy the Vite dist/ artifact with GitHub Actions. Do not publish the repository source files from main directly.')
        }, 8000)
      })()
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
