<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f6f6f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LINK" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icon-180.png" />
  <link rel="icon" href="./assets/icon-192.png" />
  <title>LINK PWA 1.0</title>
  <style>
    :root{
      --accent:#6C5CE7;--accent2:#8B7BFF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;
      --bg:#f6f6f8;--card:rgba(255,255,255,.82);--card-solid:#fff;--text:#101114;--muted:#7b7d86;
      --line:rgba(16,17,20,.08);--soft:#eeeff3;--glass:rgba(250,250,252,.72);--shadow:0 20px 55px rgba(33,35,45,.10);
      --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
      color-scheme:light;
    }
    [data-theme="dark"]{
      --bg:#090a0d;--card:rgba(24,25,30,.82);--card-solid:#17181d;--text:#f7f7f8;--muted:#989aa4;
      --line:rgba(255,255,255,.085);--soft:#202127;--glass:rgba(17,18,22,.72);--shadow:0 24px 60px rgba(0,0,0,.28);
      color-scheme:dark;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;color:var(--text);overscroll-behavior:none}
    body{min-height:100dvh;overflow:hidden}
    button,input,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    .app{height:100dvh;max-width:680px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}
    .screen{height:100%;overflow:auto;padding:calc(var(--safe-top) + 6px) 16px calc(110px + var(--safe-bottom));scrollbar-width:none}
    .screen::-webkit-scrollbar{display:none}
    .hidden{display:none!important}
    .topbar{height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;margin:0 -16px;padding:0 16px;background:linear-gradient(180deg,var(--bg) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .brand{font-size:26px;font-weight:950;letter-spacing:-1.4px}
    .build{font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--muted);margin-top:-3px}
    .row{display:flex;align-items:center}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.grow{flex:1;min-width:0}
    .iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.05);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .iconbtn:active,.btn:active,.navbtn:active,.person:active,.chatrow:active{transform:scale(.97)}
    .hero{margin:12px 0 18px;border-radius:28px;padding:22px;background:linear-gradient(135deg,#6C5CE7,#9A8CFF 58%,#B5A9FF);color:#fff;box-shadow:0 22px 50px rgba(108,92,231,.28);position:relative;overflow:hidden}
    .hero:before,.hero:after{content:"";position:absolute;border-radius:999px;background:rgba(255,255,255,.13);filter:blur(1px)}.hero:before{width:180px;height:180px;right:-70px;top:-70px}.hero:after{width:110px;height:110px;right:60px;bottom:-65px}
    .hero .eyebrow{font-size:11px;font-weight:850;letter-spacing:.6px;opacity:.72;text-transform:uppercase}.hero h1{font-size:34px;line-height:.98;letter-spacing:-1.7px;margin:10px 0 8px}.hero p{font-size:14px;line-height:1.45;margin:0;max-width:340px;opacity:.86}
    .hero .badge{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.16);font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,.17)}
    .sectionhead{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 2px 10px}.sectionhead h2{font-size:21px;letter-spacing:-.65px;margin:0}.sectionhead button{border:0;background:none;color:var(--accent);font-weight:800;font-size:13px;padding:4px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
    .notes{display:flex;gap:11px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none}.notes::-webkit-scrollbar{display:none}.note{width:78px;flex:0 0 78px;text-align:center;position:relative}.note-bubble{height:60px;border-radius:23px;background:var(--card-solid);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:7px;font-size:11px;line-height:1.15;font-weight:750;box-shadow:0 8px 20px rgba(0,0,0,.05);position:relative}.note-bubble:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--card-solid);bottom:-4px;left:13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .note .avatar{margin:-2px auto 4px}.note-name{font-size:10.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
    .avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#a99cff);color:#fff;font-weight:900;position:relative;overflow:hidden;flex:0 0 auto}.avatar.small{width:40px;height:40px}.avatar.big{width:92px;height:92px;font-size:26px}.avatar img{width:100%;height:100%;object-fit:cover}.presence{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2px solid var(--card-solid)}
    .moments{display:flex;gap:13px;overflow-x:auto;padding:2px 0 7px;scrollbar-width:none}.moments::-webkit-scrollbar{display:none}.moment{width:74px;flex:0 0 74px;text-align:center}.moment-ring{width:66px;height:66px;border-radius:50%;padding:2.5px;margin:auto;background:linear-gradient(135deg,#ff375f,#ff9f0a,#6c5ce7);box-shadow:0 7px 18px rgba(108,92,231,.15)}.moment-ring .avatar{width:61px;height:61px;border:3px solid var(--bg)}.moment-name{font-size:10.5px;font-weight:750;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{min-height:96px;padding:15px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 26px rgba(0,0,0,.05)}.quick .qicon{width:37px;height:37px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:18px;margin-bottom:9px}.quick strong{font-size:14px;display:block}.quick span{font-size:11px;color:var(--muted);line-height:1.35;display:block;margin-top:3px}
    .person,.chatrow{display:flex;align-items:center;gap:12px;min-height:70px;padding:10px 10px;border-radius:20px;transition:.15s}.person:hover,.chatrow:hover{background:var(--soft)}.person h3,.chatrow h3{font-size:15px;margin:0;letter-spacing:-.2px}.sub{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{padding:6px 9px;border-radius:999px;background:var(--soft);font-size:10.5px;font-weight:850;white-space:nowrap}.pill.accent{background:rgba(108,92,231,.12);color:var(--accent)}.pill.green{background:rgba(48,209,88,.12);color:var(--green)}
    .search{height:48px;border-radius:17px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:9px;padding:0 14px;margin:10px 0 14px}.search input{width:100%;border:0;outline:0;background:transparent;font-size:15px}.search span{opacity:.55}
    .nav{position:absolute;z-index:70;left:12px;right:12px;bottom:calc(10px + var(--safe-bottom));height:72px;border-radius:26px;background:var(--glass);border:1px solid rgba(255,255,255,.38);box-shadow:0 18px 50px rgba(17,18,25,.18);display:grid;grid-template-columns:repeat(4,1fr);padding:6px;backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%)}[data-theme="dark"] .nav{border-color:rgba(255,255,255,.07)}
    .navbtn{border:0;background:transparent;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10px;font-weight:800;transition:.16s}.navbtn .ni{font-size:20px;line-height:1}.navbtn.active{background:var(--card-solid);color:var(--text);box-shadow:0 8px 20px rgba(0,0,0,.08)}
    .profilehero{text-align:center;padding:22px 16px 18px;margin-top:8px}.profilehero .avatar{margin:auto}.displayname{font-size:24px;font-weight:950;letter-spacing:-.7px;margin-top:12px}.username{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}.bio{font-size:13px;line-height:1.45;max-width:360px;margin:12px auto 0}.badges{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.stat strong{display:block;font-size:18px}.stat span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
    .settingslist{overflow:hidden}.setting{min-height:59px;display:flex;align-items:center;gap:12px;padding:0 15px;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.seticon{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center}.setting strong{font-size:14px}.setting small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}.chev{color:var(--muted);font-size:18px}
    .btn{border:0;min-height:48px;border-radius:17px;padding:0 16px;font-weight:850;transition:.14s}.btn.primary{background:var(--accent);color:#fff;box-shadow:0 10px 25px rgba(108,92,231,.25)}.btn.secondary{background:var(--soft)}.btn.danger{background:rgba(255,69,58,.12);color:var(--red)}.btn.wide{width:100%}.btn.small{min-height:38px;padding:0 12px;border-radius:13px;font-size:12px}
    .modalback{position:absolute;inset:0;z-index:100;background:rgba(8,9,12,.30);display:flex;align-items:flex-end;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.sheet{width:100%;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;background:var(--card-solid);padding:12px 16px calc(20px + var(--safe-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.18)}.grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 14px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheethead h2{font-size:22px;margin:0;letter-spacing:-.65px}.close{width:34px;height:34px;border:0;border-radius:50%;background:var(--soft);font-weight:900}
    .field{margin:11px 0}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 3px 6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:13px 14px;outline:none;font-size:15px}.field textarea{min-height:82px;resize:none}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--soft);padding:9px 12px;border-radius:999px;font-size:12px;font-weight:800}.chip.active{background:var(--accent);color:#fff;border-color:transparent}
    .chatpage{position:absolute;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--safe-top)}.chathead{height:64px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.back{width:36px;height:36px;border:0;border-radius:50%;background:var(--soft);font-size:20px}.chatbody{flex:1;overflow:auto;padding:16px 12px 12px}.msgrow{display:flex;margin:4px 0}.msgrow.me{justify-content:flex-end}.bubble{max-width:78%;padding:10px 13px;border-radius:19px;background:var(--soft);font-size:14px;line-height:1.35}.msgrow.me .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:6px}.msgrow.them .bubble{border-bottom-left-radius:6px}.msgmeta{font-size:9.5px;opacity:.58;margin-top:4px}.composer{padding:9px 10px calc(9px + var(--safe-bottom));display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.composer textarea{flex:1;max-height:120px;min-height:43px;border:1px solid var(--line);background:var(--card-solid);border-radius:19px;padding:11px 13px;resize:none;outline:none}.send{width:43px;height:43px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:17px}
    .auth{height:100%;overflow:auto;padding:calc(var(--safe-top) + 26px) 20px calc(var(--safe-bottom) + 30px);display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 90% 10%,rgba(108,92,231,.18),transparent 28rem),var(--bg)}.authlogo{width:72px;height:72px;border-radius:24px;background:#101114;color:#fff;display:grid;place-items:center;font-size:31px;font-weight:950;box-shadow:0 16px 36px rgba(0,0,0,.17)}[data-theme="dark"] .authlogo{background:#fff;color:#090a0d}.auth h1{font-size:45px;letter-spacing:-2px;line-height:.95;margin:24px 0 8px}.auth p{color:var(--muted);line-height:1.5;margin:0 0 20px;max-width:430px}.authcard{padding:16px;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.localbanner{padding:11px 12px;border-radius:15px;background:rgba(48,209,88,.10);color:#1e8c3b;font-size:11px;line-height:1.4;font-weight:720;margin-bottom:11px}[data-theme="dark"] .localbanner{color:#70e48a}
    .installtip{margin-top:12px;padding:13px 14px;border-radius:18px;background:var(--soft);font-size:11.5px;line-height:1.45;color:var(--muted)}
    .toast{position:absolute;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(94px + var(--safe-bottom));z-index:200;background:rgba(16,17,20,.92);color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:750;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .empty{text-align:center;padding:44px 20px;color:var(--muted)}.empty .eicon{font-size:36px;margin-bottom:10px}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}
    .version{font-size:10.5px;text-align:center;color:var(--muted);margin:18px 0 2px}
    @media(min-width:700px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script>
  (()=>{
    'use strict';
    const VERSION='LINK PWA 1.0';
    const STORE='link-pwa-1.0-state';
    const qs=(s,r=document)=>r.querySelector(s), qsa=(s,r=document)=>[...r.querySelectorAll(s)];
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const id=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
    const now=()=>Date.now();
    const initials=n=>String(n||'L').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    const ago=t=>{const d=Math.max(0,now()-t),m=Math.floor(d/60000);if(m<1)return 'teď';if(m<60)return `${m} min`;const h=Math.floor(m/60);if(h<24)return `${h} h`;return `${Math.floor(h/24)} d`;};
    const defaultState=()=>({
      onboarded:false,theme:'light',activeTab:'feed',installDismissed:false,
      me:{id:'me',name:'',username:'',bio:'Building my LINK.',status:'Online',statusEmoji:'✨',plan:'Free',photo:null},
      people:[
        {id:'alex',name:'Alex Novak',username:'@alex',bio:'design, coffee, late nights',status:'Online',emoji:'⚡️',verified:true,color:'#3A86FF'},
        {id:'nela',name:'Nela K.',username:'@nela',bio:'music / prague',status:'Busy',emoji:'🎧',verified:false,color:'#FF5C8A'},
        {id:'viktor',name:'Viktor',username:'@viktor',bio:'somewhere outside',status:'Online',emoji:'🪐',verified:false,color:'#00B894'},
        {id:'linkofficial',name:'LINK Official',username:'@link',bio:'Official LINK updates',status:'Official',emoji:'✦',verified:true,official:true,color:'#6C5CE7'}
      ],
      linked:['alex','nela','viktor'],requests:[{id:'req1',personId:'viktor'}],favorites:['alex'],
      notes:[{id:'n1',ownerId:'alex',text:'coffee?',createdAt:now()-1200000},{id:'n2',ownerId:'nela',text:'new song 🎧',createdAt:now()-2500000}],
      moments:[{id:'m1',ownerId:'alex',caption:'night city',emoji:'🌃',createdAt:now()-3600000},{id:'m2',ownerId:'nela',caption:'studio',emoji:'🎙️',createdAt:now()-7200000}],
      chats:{
        alex:[{id:'a1',from:'alex',text:'LINK PWA looks clean 👀',at:now()-5400000},{id:'a2',from:'me',text:'Solo test mode for now.',at:now()-5300000}],
        nela:[{id:'n1',from:'nela',text:'Try the new PWA install flow ✨',at:now()-9600000}],
        linkofficial:[{id:'o1',from:'linkofficial',text:'Welcome to LINK PWA 1.0 · Solo Testing. No backend is connected.',at:now()-200000}]
      },
      groups:{},
      settings:{readReceipts:true,typing:true,activity:true,language:'cs',doubleTap:'❤️'},
      drafts:{},
      activityLog:[]
    });
    let state=load(); let currentChat=null; let modal=null; let deferredInstall=null;
    function load(){try{const raw=localStorage.getItem(STORE);return raw?{...defaultState(),...JSON.parse(raw)}:defaultState();}catch{return defaultState();}}
    function save(){localStorage.setItem(STORE,JSON.stringify(state));}
    function person(pid){return pid==='me'?state.me:state.people.find(p=>p.id===pid)||{id:pid,name:'Unknown',username:'@unknown',color:'#6C5CE7'};}
    function avatar(p,small=false,big=false){const cls=`avatar${small?' small':''}${big?' big':''}`;const c=p.color||'#6C5CE7';return `<div class="${cls}" style="background:linear-gradient(135deg,${c},#9b8cff)">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(initials(p.name))}${p.id!=='me'&&p.status!=='Offline'?'<span class="presence"></span>':''}</div>`;}
    function verify(p){return p.verified?` <span title="Verified" style="color:${p.official?'#E5AA17':'#0A84FF'};font-size:12px">●</span>`:'';}
    function toast(msg){let t=qs('.toast');if(!t){t=document.createElement('div');t.className='toast';document.getElementById('app').appendChild(t)}t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1900);}
    function render(){document.documentElement.dataset.theme=state.theme; if(!state.onboarded){renderAuth();return;} renderShell();}
    function renderAuth(){
      document.getElementById('app').innerHTML=`<section class="auth"><div class="authlogo">L</div><h1>LINK<br>PWA 1.0</h1><p>Lokální solo build odvozený z LINK 4.4. Bez backendu, bez shared session, bez synchronizace mezi zařízeními.</p><div class="authcard"><div class="localbanner">● SOLO TESTING · data zůstávají pouze v tomto prohlížeči / PWA.</div><div class="field"><label>JMÉNO</label><input id="authName" autocomplete="off" placeholder="Tvoje jméno"></div><div class="field"><label>USERNAME</label><input id="authUser" autocomplete="off" autocapitalize="off" placeholder="@username"></div><button class="btn primary wide" id="startBtn">Vstoupit do LINKu</button><div class="installtip">Na iPhonu: otevři web v Safari → Sdílet → <strong>Přidat na plochu</strong>. Po instalaci se LINK spustí jako samostatná PWA.</div></div><div class="version">${VERSION} · local-first</div></section>`;
      qs('#startBtn').onclick=()=>{const n=qs('#authName').value.trim(),u=qs('#authUser').value.trim().replace(/^@/,'');if(!n||u.length<2){toast('Vyplň jméno a username');return;}state.me.name=n;state.me.username='@'+u.toLowerCase().replace(/[^a-z0-9_.]/g,'');state.onboarded=true;save();render();};
    }
    function topbar(title='LINK',sub='PWA 1.0 · SOLO') {return `<div class="topbar"><div><div class="brand">${esc(title)}</div><div class="build">${esc(sub)}</div></div><div class="row gap8"><button class="iconbtn" data-action="search">⌕</button><button class="iconbtn" data-action="compose">＋</button></div></div>`;}
    function nav(){const items=[['feed','⌂','Home'],['people','◎','People'],['chats','◌','Chats'],['profile','◉','Profile']];return `<nav class="nav">${items.map(([k,i,l])=>`<button class="navbtn ${state.activeTab===k?'active':''}" data-tab="${k}"><span class="ni">${i}</span>${l}</button>`).join('')}</nav>`;}
    function renderShell(){
      const content=state.activeTab==='feed'?feed():state.activeTab==='people'?people():state.activeTab==='chats'?chats():profile();
      document.getElementById('app').innerHTML=`<main class="screen">${content}</main>${nav()}${modalHtml()}${chatHtml()}<div class="toast"></div>`;
      bind();
    }
    function feed(){
      const myNote=state.notes.find(n=>n.ownerId==='me');
      const recent=Object.entries(state.chats).map(([pid,list])=>({pid,last:list[list.length-1]})).filter(x=>x.last).sort((a,b)=>b.last.at-a.last.at).slice(0,3);
      return `${topbar()}<section class="hero"><div class="eyebrow">LINK PWA 1.0</div><h1>Your people.<br>Right now.</h1><p>Moments, Notes, local chats and your LINK identity — running without a backend.</p><div class="badge">● Local data · Offline-ready</div></section>
      <div class="sectionhead"><h2>Notes</h2><button data-action="note">${myNote?'Upravit':'Přidat'}</button></div><div class="notes"><div class="note" data-action="note"><div class="note-bubble">${esc(myNote?.text||'Napiš poznámku…')}</div>${avatar(state.me,true)}<div class="note-name">Ty</div></div>${state.notes.filter(n=>n.ownerId!=='me').map(n=>{const p=person(n.ownerId);return `<div class="note"><div class="note-bubble">${esc(n.text)}</div>${avatar(p,true)}<div class="note-name">${esc(p.name.split(' ')[0])}</div></div>`}).join('')}</div>
      <div class="sectionhead"><h2>Moments</h2><button data-action="moment">Nový</button></div><div class="moments"><div class="moment" data-action="moment"><div class="moment-ring" style="background:var(--soft)">${avatar(state.me)}</div><div class="moment-name">Tvůj Moment</div></div>${state.moments.map(m=>{const p=person(m.ownerId);return `<div class="moment" data-moment="${m.id}"><div class="moment-ring">${avatar(p)}</div><div class="moment-name">${esc(p.name.split(' ')[0])}</div></div>`}).join('')}</div>
      <div class="sectionhead"><h2>LINK Now</h2></div><div class="quickgrid"><div class="quick" data-action="status"><div class="qicon">${esc(state.me.statusEmoji||'✨')}</div><strong>${esc(state.me.status||'Online')}</strong><span>Nastav svůj živý status lokálně.</span></div><div class="quick" data-action="install"><div class="qicon">↗</div><strong>Přidat na plochu</strong><span>Standalone PWA pro iPhone/iPad.</span></div></div>
      <div class="sectionhead"><h2>Recent chats</h2><button data-tab="chats">Zobrazit vše</button></div><div class="card">${recent.length?recent.map(x=>chatRow(x.pid,x.last)).join(''):'<div class="empty"><strong>Žádné chaty</strong>Začni lokální konverzaci v People.</div>'}</div>`;
    }
    function people(){
      return `${topbar('People','LOCAL DIRECTORY')}<div class="search"><span>⌕</span><input id="peopleSearch" placeholder="Hledat @username nebo jméno"></div><div id="peopleList" class="card">${peopleRows(state.people)}</div><div class="sectionhead"><h2>Incoming requests</h2></div><div class="card">${state.requests.length?state.requests.map(r=>{const p=person(r.personId);return `<div class="person">${avatar(p)}<div class="grow"><h3>${esc(p.name)}${verify(p)}</h3><div class="sub">${esc(p.username)}</div></div><button class="btn small primary" data-accept="${r.id}">Přijmout</button></div>`}).join(''):'<div class="empty"><div class="eicon">✓</div><strong>Všechno vyřízeno</strong>Žádné nové žádosti.</div>'}</div>`;
    }
    function peopleRows(list){return list.map(p=>`<div class="person" data-person="${p.id}">${avatar(p)}<div class="grow"><h3>${esc(p.name)}${verify(p)}</h3><div class="sub">${esc(p.username)} · ${esc(p.bio||'')}</div></div><span class="pill ${state.linked.includes(p.id)?'green':'accent'}">${state.linked.includes(p.id)?'LINKED':'VIEW'}</span></div>`).join('');}
    function chatRow(pid,last,group=false){const p=group?state.groups[pid]:person(pid);const unread=last?.from!=='me';return `<div class="chatrow" data-chat="${pid}" data-group="${group?'1':'0'}">${group?`<div class="avatar" style="background:linear-gradient(135deg,#101114,#6C5CE7)">👥</div>`:avatar(p)}<div class="grow"><h3>${esc(p.name)}${!group?verify(p):''}</h3><div class="sub">${esc(last?.text||'Začni konverzaci')}</div></div><div style="text-align:right"><div class="sub">${last?ago(last.at):''}</div>${unread?'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px"></span>':''}</div></div>`;}
    function chats(){
      const rows=Object.entries(state.chats).map(([pid,list])=>({pid,last:list[list.length-1]})).sort((a,b)=>(b.last?.at||0)-(a.last?.at||0));
      const grows=Object.values(state.groups).map(g=>({g,last:(g.messages||[]).at?g.messages[g.messages.length-1]:g.messages?.[g.messages.length-1]}));
      return `${topbar('Chats','LOCAL MESSAGES')}<div class="row gap8" style="margin:10px 0 14px"><button class="btn secondary grow" data-action="newgroup">＋ New group</button><button class="btn secondary" data-action="resetChats">Reset demo</button></div><div class="card">${rows.length?rows.map(x=>chatRow(x.pid,x.last)).join(''):'<div class="empty"><div class="eicon">◌</div><strong>No chats yet</strong>Start the conversation.</div>'}</div>${Object.keys(state.groups).length?`<div class="sectionhead"><h2>Groups</h2></div><div class="card">${Object.entries(state.groups).map(([gid,g])=>chatRow(gid,g.messages?.[g.messages.length-1],true)).join('')}</div>`:''}<div class="installtip">Zprávy jsou v PWA 1.0 uložené pouze lokálně. Tento solo build nepoužívá skutečné E2E doručování ani realtime backend.</div>`;
    }
    function profile(){
      return `${topbar('Profile','YOUR LOCAL LINK')}<section class="card profilehero">${avatar(state.me,false,true)}<div class="displayname">${esc(state.me.name)}</div><div class="username">${esc(state.me.username)}</div><div class="badges"><span class="pill accent">${esc(state.me.plan||'Free')}</span><span class="pill green">SOLO</span></div><div class="bio">${esc(state.me.bio||'')}</div><div class="stats"><div class="stat"><strong>${state.linked.length}</strong><span>LINKs</span></div><div class="stat"><strong>${Object.keys(state.chats).length}</strong><span>Chats</span></div><div class="stat"><strong>${state.moments.filter(x=>x.ownerId==='me').length}</strong><span>Moments</span></div></div></section>
      <div class="sectionhead"><h2>Identity</h2></div><div class="card settingslist"><div class="setting" data-action="editprofile"><div class="seticon">✎</div><div class="grow"><strong>Edit profile</strong><small>Name, username, bio</small></div><span class="chev">›</span></div><div class="setting" data-action="status"><div class="seticon">${esc(state.me.statusEmoji)}</div><div class="grow"><strong>Custom status</strong><small>${esc(state.me.status)}</small></div><span class="chev">›</span></div><div class="setting" data-action="plan"><div class="seticon">✦</div><div class="grow"><strong>LINK Plus / Pro</strong><small>Local feature preview</small></div><span class="chev">›</span></div></div>
      <div class="sectionhead"><h2>Settings</h2></div><div class="card settingslist"><div class="setting" data-action="theme"><div class="seticon">◐</div><div class="grow"><strong>Appearance</strong><small>${state.theme==='dark'?'Dark':'Light'}</small></div><span class="chev">›</span></div><div class="setting" data-action="privacy"><div class="seticon">⌁</div><div class="grow"><strong>Privacy & chat</strong><small>Read receipts, typing, Double Tap</small></div><span class="chev">›</span></div><div class="setting" data-action="install"><div class="seticon">↗</div><div class="grow"><strong>Install LINK PWA</strong><small>Add to Home Screen</small></div><span class="chev">›</span></div><div class="setting" data-action="wipe"><div class="seticon">×</div><div class="grow"><strong style="color:var(--red)">Erase local data</strong><small>Reset this PWA</small></div><span class="chev">›</span></div></div><div class="version">Based on LINK 4.4 · ${VERSION}<br>No Supabase · No backend · No external runtime dependencies</div>`;
    }
    function modalHtml(){if(!modal)return'';let body='';
      if(modal==='note'){const n=state.notes.find(n=>n.ownerId==='me');body=`<div class="sheethead"><h2>Your Note</h2><button class="close" data-close>×</button></div><div class="field"><label>NOTE</label><input id="noteText" maxlength="50" value="${esc(n?.text||'')}" placeholder="Leave a note…"></div><button class="btn primary wide" data-save-note>Uložit Note</button>${n?'<button class="btn danger wide" style="margin-top:8px" data-delete-note>Smazat Note</button>':''}`;}
      if(modal==='moment'){body=`<div class="sheethead"><h2>New Moment</h2><button class="close" data-close>×</button></div><div class="field"><label>EMOJI</label><input id="momentEmoji" maxlength="4" placeholder="✨" value="✨"></div><div class="field"><label>CAPTION</label><input id="momentCaption" maxlength="80" placeholder="Co se děje?"></div><button class="btn primary wide" data-save-moment>Publikovat lokálně</button><div class="installtip">Solo PWA: Moment se uloží pouze na tomto zařízení.</div>`;}
      if(modal==='status'){body=`<div class="sheethead"><h2>LINK Now</h2><button class="close" data-close>×</button></div><div class="field"><label>STATUS</label><input id="statusText" maxlength="36" value="${esc(state.me.status||'')}"></div><div class="field"><label>ICON</label><input id="statusEmoji" maxlength="4" value="${esc(state.me.statusEmoji||'✨')}"></div><button class="btn primary wide" data-save-status>Uložit status</button>`;}
      if(modal==='editprofile'){body=`<div class="sheethead"><h2>Edit profile</h2><button class="close" data-close>×</button></div><div class="field"><label>JMÉNO</label><input id="editName" value="${esc(state.me.name)}"></div><div class="field"><label>USERNAME</label><input id="editUser" value="${esc(state.me.username)}"></div><div class="field"><label>BIO</label><textarea id="editBio">${esc(state.me.bio||'')}</textarea></div><button class="btn primary wide" data-save-profile>Save</button>`;}
      if(modal==='theme'){body=`<div class="sheethead"><h2>Appearance</h2><button class="close" data-close>×</button></div><div class="chips"><button class="chip ${state.theme==='light'?'active':''}" data-theme-choice="light">☀️ Light</button><button class="chip ${state.theme==='dark'?'active':''}" data-theme-choice="dark">🌙 Dark</button></div>`;}
      if(modal==='plan'){body=`<div class="sheethead"><h2>LINK membership</h2><button class="close" data-close>×</button></div><div class="card" style="padding:16px;margin-bottom:10px"><strong style="font-size:19px">LINK Plus</strong><div class="sub">Themes, custom Double Tap and identity extras.</div><button class="btn ${state.me.plan==='Plus'?'secondary':'primary'} wide" style="margin-top:14px" data-plan="Plus">${state.me.plan==='Plus'?'Aktivní':'Aktivovat pro test'}</button></div><div class="card" style="padding:16px"><strong style="font-size:19px">LINK Pro</strong><div class="sub">Full premium preview for solo testing.</div><button class="btn ${state.me.plan==='Pro'?'secondary':'primary'} wide" style="margin-top:14px" data-plan="Pro">${state.me.plan==='Pro'?'Aktivní':'Aktivovat pro test'}</button></div><button class="btn danger wide" style="margin-top:10px" data-plan="Free">Reset na Free</button>`;}
      if(modal==='privacy'){body=`<div class="sheethead"><h2>Privacy & chat</h2><button class="close" data-close>×</button></div>${toggleRow('Read receipts','readReceipts')}${toggleRow('Typing indicators','typing')}${toggleRow('Active status','activity')}<div class="field"><label>DOUBLE TAP REACTION</label><input id="doubleTap" maxlength="4" value="${esc(state.settings.doubleTap||'❤️')}"></div><button class="btn primary wide" data-save-privacy>Save</button>`;}
      if(modal==='install'){body=`<div class="sheethead"><h2>Install LINK</h2><button class="close" data-close>×</button></div><div class="card" style="padding:16px"><strong>iPhone / iPad</strong><p class="sub" style="white-space:normal;line-height:1.5">1. Otevři tuto stránku v Safari.<br>2. Klepni na Sdílet.<br>3. Vyber <b>Přidat na plochu</b>.<br>4. Spusť LINK z nové ikony.</p></div><button class="btn primary wide" style="margin-top:10px" data-native-install>Instalovat, pokud je dostupné</button><div class="installtip">PWA vyžaduje HTTPS (GitHub Pages je v pořádku). Po první návštěvě funguje shell aplikace i offline.</div>`;}
      if(modal==='newgroup'){body=`<div class="sheethead"><h2>Create Group Chat</h2><button class="close" data-close>×</button></div><div class="field"><label>GROUP NAME</label><input id="groupName" placeholder="Weekend crew"></div><div class="field"><label>MEMBERS</label><div class="chips">${state.people.filter(p=>!p.official).map(p=>`<button class="chip" data-member="${p.id}">${esc(p.name)}</button>`).join('')}</div></div><button class="btn primary wide" data-create-group>Create group</button>`;}
      if(modal==='search'){body=`<div class="sheethead"><h2>Search LINK</h2><button class="close" data-close>×</button></div><div class="search" style="margin:0"><span>⌕</span><input id="globalSearch" autofocus placeholder="People, chats, groups"></div><div id="globalResults" style="margin-top:10px"></div>`;}
      if(modal==='compose'){body=`<div class="sheethead"><h2>Create</h2><button class="close" data-close>×</button></div><div class="quickgrid"><div class="quick" data-modal-jump="note"><div class="qicon">✎</div><strong>Note</strong><span>Share a short local Note.</span></div><div class="quick" data-modal-jump="moment"><div class="qicon">◎</div><strong>Moment</strong><span>Post a solo Moment.</span></div><div class="quick" data-modal-jump="newgroup"><div class="qicon">👥</div><strong>Group</strong><span>Create a local group chat.</span></div><div class="quick" data-tab-jump="people"><div class="qicon">＋</div><strong>Find people</strong><span>Open local directory.</span></div></div>`;}
      if(modal?.startsWith('person:')){const p=person(modal.split(':')[1]);body=`<div class="sheethead"><h2>Profile</h2><button class="close" data-close>×</button></div><div class="profilehero">${avatar(p,false,true)}<div class="displayname">${esc(p.name)}${verify(p)}</div><div class="username">${esc(p.username)}</div><div class="bio">${esc(p.bio||'')}</div><div class="badges">${p.official?'<span class="pill accent">LINK OFFICIAL</span>':''}<span class="pill green">${state.linked.includes(p.id)?'LINKED':'NOT LINKED'}</span></div></div><button class="btn primary wide" data-open-chat="${p.id}">Message</button>`;}
      if(modal?.startsWith('moment:')){const m=state.moments.find(x=>x.id===modal.split(':')[1]);const p=person(m?.ownerId);body=m?`<div class="sheethead"><h2>Moment</h2><button class="close" data-close>×</button></div><div style="min-height:320px;border-radius:26px;background:linear-gradient(135deg,#101114,#392f67);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:24px;text-align:center"><div style="font-size:80px">${esc(m.emoji||'✨')}</div><div style="font-size:25px;font-weight:900;margin-top:16px">${esc(m.caption||'Moment')}</div><div style="font-size:12px;opacity:.65;margin-top:8px">${esc(p.name)} · ${ago(m.createdAt)}</div></div>`:'Moment nenalezen';}
      return `<div class="modalback"><div class="sheet"><div class="grab"></div>${body}</div></div>`;
    }
    function toggleRow(title,key){return `<div class="setting" style="padding:0"><div class="grow"><strong>${title}</strong></div><button class="chip ${state.settings[key]?'active':''}" data-toggle="${key}">${state.settings[key]?'On':'Off'}</button></div>`;}
    function chatHtml(){if(!currentChat)return'';const isGroup=!!state.groups[currentChat],p=isGroup?state.groups[currentChat]:person(currentChat),list=isGroup?(p.messages||[]):(state.chats[currentChat]||[]);return `<section class="chatpage"><div class="chathead"><button class="back" data-chat-close>‹</button>${isGroup?'<div class="avatar small">👥</div>':avatar(p,true)}<div class="grow"><strong>${esc(p.name)}${!isGroup?verify(p):''}</strong><div class="sub">${isGroup?`${p.members.length} members`:(p.official?'Official channel · read only':'Local solo chat')}</div></div></div><div class="chatbody" id="chatBody">${list.map(m=>`<div class="msgrow ${m.from==='me'?'me':'them'}"><div class="bubble">${esc(m.text)}<div class="msgmeta">${new Date(m.at).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join('')}</div>${p.official?'<div class="composer"><div class="grow" style="text-align:center;color:var(--muted);font-size:12px;padding:10px">Na LINK Official nelze odpovídat v solo buildu.</div></div>':`<div class="composer"><textarea id="composer" rows="1" placeholder="Message"></textarea><button class="send" data-send>↑</button></div>`}</section>`;}
    function bind(){
      qsa('[data-tab]').forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.tab;save();render();});
      qsa('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
      qsa('[data-person]').forEach(b=>b.onclick=()=>{modal='person:'+b.dataset.person;render();});
      qsa('[data-chat]').forEach(b=>b.onclick=()=>{currentChat=b.dataset.chat;render();setTimeout(()=>{const el=qs('#chatBody');if(el)el.scrollTop=el.scrollHeight},0)});
      qsa('[data-accept]').forEach(b=>b.onclick=()=>{const r=state.requests.find(x=>x.id===b.dataset.accept);if(r&&!state.linked.includes(r.personId))state.linked.push(r.personId);state.requests=state.requests.filter(x=>x.id!==b.dataset.accept);save();render();toast('LINK request accepted');});
      qsa('[data-close]').forEach(b=>b.onclick=()=>{modal=null;render();});
      const mb=qs('.modalback');if(mb)mb.onclick=e=>{if(e.target===mb){modal=null;render();}};
      if(qs('#peopleSearch'))qs('#peopleSearch').oninput=e=>{qs('#peopleList').innerHTML=peopleRows(state.people.filter(p=>(p.name+' '+p.username).toLowerCase().includes(e.target.value.toLowerCase())));qsa('[data-person]').forEach(b=>b.onclick=()=>{modal='person:'+b.dataset.person;render();});};
      bindModal(); bindChat(); edgeSwipe();
    }
    function action(a){if(['note','moment','status','editprofile','theme','plan','privacy','install','newgroup','search','compose'].includes(a)){modal=a;render();return;}if(a==='wipe'){if(confirm('Smazat všechna lokální LINK PWA data?')){localStorage.removeItem(STORE);state=defaultState();render();}return;}if(a==='resetChats'){state.chats=defaultState().chats;save();render();toast('Demo chats reset');}}
    function bindModal(){
      const on=(s,fn)=>{const e=qs(s);if(e)e.onclick=fn};
      on('[data-save-note]',()=>{const t=qs('#noteText').value.trim();state.notes=state.notes.filter(n=>n.ownerId!=='me');if(t)state.notes.unshift({id:id(),ownerId:'me',text:t,createdAt:now()});save();modal=null;render();toast('Note saved');});
      on('[data-delete-note]',()=>{state.notes=state.notes.filter(n=>n.ownerId!=='me');save();modal=null;render();});
      on('[data-save-moment]',()=>{const c=qs('#momentCaption').value.trim(),e=qs('#momentEmoji').value.trim()||'✨';state.moments.unshift({id:id(),ownerId:'me',caption:c||'Moment',emoji:e,createdAt:now()});save();modal=null;render();toast('Moment posted locally');});
      on('[data-save-status]',()=>{state.me.status=qs('#statusText').value.trim()||'Online';state.me.statusEmoji=qs('#statusEmoji').value.trim()||'✨';save();modal=null;render();});
      on('[data-save-profile]',()=>{state.me.name=qs('#editName').value.trim()||state.me.name;state.me.username='@'+qs('#editUser').value.trim().replace(/^@/,'').toLowerCase();state.me.bio=qs('#editBio').value.trim();save();modal=null;render();});
      qsa('[data-theme-choice]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.themeChoice;save();render();});
      qsa('[data-plan]').forEach(b=>b.onclick=()=>{state.me.plan=b.dataset.plan;save();modal=null;render();toast('Plan changed locally');});
      qsa('[data-toggle]').forEach(b=>b.onclick=()=>{const k=b.dataset.toggle;state.settings[k]=!state.settings[k];save();render();});
      on('[data-save-privacy]',()=>{state.settings.doubleTap=qs('#doubleTap').value.trim()||'❤️';save();modal=null;render();});
      on('[data-native-install]',async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;modal=null;render();}else toast('Na iOS použij Sdílet → Přidat na plochu');});
      const selected=new Set();qsa('[data-member]').forEach(b=>b.onclick=()=>{const k=b.dataset.member;selected.has(k)?selected.delete(k):selected.add(k);b.classList.toggle('active');});
      on('[data-create-group]',()=>{const name=qs('#groupName').value.trim()||'New Group';const gid='g_'+id();state.groups[gid]={id:gid,name,members:['me',...selected],messages:[{id:id(),from:'me',text:'Group created locally.',at:now()}]};save();modal=null;currentChat=gid;render();});
      on('[data-open-chat]',()=>{currentChat=qs('[data-open-chat]').dataset.openChat;modal=null;render();});
      qsa('[data-modal-jump]').forEach(b=>b.onclick=()=>{modal=b.dataset.modalJump;render();});
      qsa('[data-tab-jump]').forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.tabJump;modal=null;save();render();});
      const gs=qs('#globalSearch');if(gs){const run=()=>{const q=gs.value.trim().toLowerCase();const matches=state.people.filter(p=>(p.name+' '+p.username).toLowerCase().includes(q));qs('#globalResults').innerHTML=q?(matches.length?`<div class="card">${peopleRows(matches)}</div>`:'<div class="empty"><strong>No results</strong>Zkus jiné jméno.</div>'):'';qsa('[data-person]').forEach(b=>b.onclick=()=>{modal='person:'+b.dataset.person;render();});};gs.oninput=run;setTimeout(()=>gs.focus(),50);}
    }
    function bindChat(){
      const close=qs('[data-chat-close]');if(close)close.onclick=()=>{currentChat=null;render();};
      const send=qs('[data-send]'),c=qs('#composer');if(send&&c){const go=()=>{const t=c.value.trim();if(!t)return;const isGroup=!!state.groups[currentChat];const msg={id:id(),from:'me',text:t,at:now()};if(isGroup)state.groups[currentChat].messages.push(msg);else{state.chats[currentChat]=state.chats[currentChat]||[];state.chats[currentChat].push(msg)}save();render();setTimeout(()=>{const el=qs('#chatBody');if(el)el.scrollTop=el.scrollHeight},0);};send.onclick=go;c.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}};}
      const body=qs('#chatBody');if(body)body.ondblclick=e=>{const b=e.target.closest('.bubble');if(b)toast(`${state.settings.doubleTap||'❤️'} reaction · local preview`);};
    }
    function edgeSwipe(){let sx=0,sy=0;qsa('.chatpage,.modalback').forEach(el=>{el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});el.addEventListener('touchend',e=>{const t=e.changedTouches[0];if(sx<22&&t.clientX-sx>85&&Math.abs(t.clientY-sy)<70){if(currentChat)currentChat=null;else modal=null;render();}},{passive:true});});}
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    render();
  })();
  </script>
</body>
</html>
