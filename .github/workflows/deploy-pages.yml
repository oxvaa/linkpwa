name: Deploy LINK PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build LINK PWA
        run: npx vite build

      - name: Verify production artifact
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets

          if grep -q '/src/main.tsx' dist/index.html; then
            echo "ERROR: raw TypeScript source is still referenced."
            exit 1
          fi

          if ! grep -q '/linkpwa/assets/' dist/index.html; then
            echo "ERROR: wrong GitHub Pages base path."
            cat dist/index.html
            exit 1
          fi

          echo "LINK PWA production build is valid."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy production build
        id: deployment
        uses: actions/deploy-pages@v4
